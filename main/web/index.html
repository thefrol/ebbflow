<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebbflow-lamp</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 24rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .meta { opacity: .6; font-size: .85rem; margin-bottom: 1.5rem; }
  label { display: block; margin: 1rem 0 .25rem; }
  input[type="time"], input[type="number"], select {
    width: 100%; box-sizing: border-box; padding: .5rem; font-size: 1rem;
  }
  .row { display: flex; align-items: center; gap: .5rem; margin: 1rem 0; }
  .row label { margin: 0; }
  button {
    width: 100%; padding: .7rem; font-size: 1rem; margin-top: 1rem; cursor: pointer;
  }
  button.secondary { background: transparent; border: 1px solid currentColor; }
  #status { margin-top: 1rem; min-height: 1.2em; }
  #status.ok { color: #2a7; }
  #status.err { color: #d44; }
  .pulse-status {
    margin: .75rem 0;
    padding: .75rem;
    background: rgba(127,127,127,.12);
    border-radius: .5rem;
    font-size: .95rem;
  }
  .pulse-status .label { opacity: .7; }
  .pulse-status .value { font-weight: 600; }
  .pulse-status .now { color: #2a7; }
  #pulse-schedule-list { margin: .5rem 0 0 0; padding: 0; list-style: none; }
  #pulse-schedule-list li { display: flex; justify-content: space-between; padding: .25rem 0; }
  #pulse-schedule-list li.past { opacity: .55; }
  #update-section { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(127,127,127,.3); }
  #update-section h2 { font-size: 1.1rem; margin-bottom: .75rem; }
  #peers-section { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(127,127,127,.3); }
  #peers-section h2 { font-size: 1.1rem; margin-bottom: .75rem; }
  #peers-list { margin: .5rem 0 0 0; padding: 0; list-style: none; }
  #peers-list li { padding: .25rem 0; }
  #peers-list a { font-weight: 600; }
  #peers-status { opacity: .7; font-size: .95rem; }
  .update-meta { opacity: .7; font-size: .9rem; margin-bottom: .5rem; }
  .update-status { margin: .75rem 0; padding: .75rem; background: rgba(127,127,127,.12); border-radius: .5rem; font-size: .95rem; min-height: 1.2em; }
  .update-status.ok { color: #2a7; background: rgba(42,170,119,.12); }
  .update-status.err { color: #d44; background: rgba(221,68,68,.12); }
  .update-status.info { color: #47a; background: rgba(68,119,170,.12); }
  #start-update:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<h1>ebbflow-lamp</h1>
<div class="meta" id="meta">загрузка…</div>

<form id="form">
  <label for="name">Имя устройства</label>
  <input type="text" id="name" maxlength="31" required>

  <label for="mode">Режим</label>
  <select id="mode">
    <option value="schedule">Расписание (свет)</option>
    <option value="pulse">Импульсы (полив)</option>
  </select>

  <div id="schedule-fields">
    <label for="on">Включение</label>
    <input type="time" id="on" required>

    <label for="off">Выключение</label>
    <input type="time" id="off" required>
  </div>

  <div id="pulse-fields" hidden>
    <label for="pulse_interval_min">Полив каждые, минут</label>
    <input type="number" id="pulse_interval_min" min="1" max="1440" required>

    <label for="pulse_duration_sec">Длительность полива, секунд</label>
    <input type="number" id="pulse_duration_sec" min="1" max="600" required>

    <div class="pulse-status" id="pulse-status" hidden>
      <div class="label">Следующий полив</div>
      <div class="value" id="next-pulse">—</div>
      <div class="now" id="manual-pulse" hidden>полив идёт</div>
    </div>

    <div class="pulse-status" id="pulse-schedule" hidden>
      <div class="label">Ближайшие поливы</div>
      <ul id="pulse-schedule-list"></ul>
    </div>

    <button type="button" class="secondary" id="water-now">Полить сейчас</button>
  </div>

  <label for="gpio">GPIO лампы</label>
  <input type="number" id="gpio" min="0" max="21" required>

  <div class="row">
    <input type="checkbox" id="enabled">
    <label for="enabled">Расписание активно</label>
  </div>

  <button type="submit">Сохранить</button>
</form>
<div id="status"></div>

<section id="peers-section">
  <h2>Другие лампы</h2>
  <div id="peers-status">поиск…</div>
  <ul id="peers-list"></ul>
</section>

<section id="update-section">
  <h2>Обновление прошивки</h2>
  <div class="update-meta" id="update-meta">Текущая версия: —</div>
  <div class="update-status" id="update-status">Нажмите «Проверить обновление»</div>
  <button type="button" class="secondary" id="check-update">Проверить обновление</button>
  <button type="button" id="start-update" disabled>Скачать обновление</button>
</section>

<script>
const statusEl = document.getElementById('status');
const modeEl = document.getElementById('mode');
const pulseStatusEl = document.getElementById('pulse-status');
const nextPulseEl = document.getElementById('next-pulse');
const manualPulseEl = document.getElementById('manual-pulse');
const pulseScheduleEl = document.getElementById('pulse-schedule');
const pulseScheduleListEl = document.getElementById('pulse-schedule-list');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

// --- OTA ------------------------------------------------------------------
const updateStatusEl = document.getElementById('update-status');
const checkUpdateBtn = document.getElementById('check-update');
const startUpdateBtn = document.getElementById('start-update');

function renderUpdateStatus(st) {
  startUpdateBtn.disabled = true;
  updateStatusEl.className = 'update-status';

  switch (st.state) {
    case 'idle':
      updateStatusEl.textContent = 'Нажмите «Проверить обновление»';
      break;
    case 'checking':
      updateStatusEl.textContent = 'Проверяю обновление…';
      updateStatusEl.classList.add('info');
      break;
    case 'update_available':
      updateStatusEl.textContent = 'Доступна версия ' + st.available_version;
      updateStatusEl.classList.add('ok');
      startUpdateBtn.disabled = false;
      break;
    case 'downloading':
      updateStatusEl.textContent = 'Скачиваю и устанавливаю обновление…';
      updateStatusEl.classList.add('info');
      break;
    case 'reboot_pending':
      updateStatusEl.textContent = 'Обновление установлено, перезагрузка…';
      updateStatusEl.classList.add('ok');
      break;
    case 'up_to_date':
      updateStatusEl.textContent = 'Установлена актуальная версия';
      updateStatusEl.classList.add('ok');
      break;
    case 'error':
      updateStatusEl.textContent = 'Ошибка: ' + st.error;
      updateStatusEl.classList.add('err');
      break;
    default:
      updateStatusEl.textContent = 'Состояние: ' + st.state;
  }
}

async function fetchUpdateStatus() {
  try {
    const st = await fetch('/api/update/status').then(r => r.json());
    renderUpdateStatus(st);
  } catch (e) {
    // молча игнорируем — связь может прерваться при перезагрузке
  }
}

checkUpdateBtn.addEventListener('click', async () => {
  setStatus('проверяю обновление…');
  try {
    const st = await fetch('/api/update/check', { method: 'POST' }).then(async r => {
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    });
    renderUpdateStatus(st);
    setStatus('проверка завершена', 'ok');
  } catch (e) {
    setStatus('ошибка проверки: ' + e.message, 'err');
    renderUpdateStatus({ state: 'error', error: e.message });
  }
});

startUpdateBtn.addEventListener('click', async () => {
  setStatus('запускаю установку обновления…');
  try {
    const r = await fetch('/api/update/start', { method: 'POST' });
    if (!r.ok) throw new Error(await r.text());
    setStatus('Обновление скачивается, устройство скоро перезагрузится', 'ok');
    await fetchUpdateStatus();
  } catch (e) {
    setStatus('ошибка: ' + e.message, 'err');
  }
});

// Показываем только поля выбранного режима
function applyModeVisibility() {
  const pulse = modeEl.value === 'pulse';
  document.getElementById('schedule-fields').hidden = pulse;
  document.getElementById('pulse-fields').hidden = !pulse;
  if (pulse) updateStatus();
}
modeEl.addEventListener('change', applyModeVisibility);

function formatDayOffset(offset) {
  switch (offset) {
    case -2: return 'позавчера';
    case -1: return 'вчера';
    case 0: return 'сегодня';
    case 1: return 'завтра';
    case 2: return 'послезавтра';
    default: return offset > 0 ? `через ${offset} дн.` : `${-offset} дн. назад`;
  }
}

function renderPulseSchedule(times) {
  pulseScheduleListEl.innerHTML = '';
  if (!times || times.length === 0) {
    pulseScheduleEl.hidden = true;
    return;
  }
  pulseScheduleEl.hidden = false;
  for (const t of times) {
    const li = document.createElement('li');
    if (t.past) li.classList.add('past');
    li.innerHTML = `<span>${t.time}</span><span>${formatDayOffset(t.day_offset)}</span>`;
    pulseScheduleListEl.appendChild(li);
  }
}

function renderStatus(s) {
  if (modeEl.value !== 'pulse') {
    pulseStatusEl.hidden = true;
    pulseScheduleEl.hidden = true;
    return;
  }
  pulseStatusEl.hidden = false;
  if (s.manual_pulse_active) {
    manualPulseEl.hidden = false;
    nextPulseEl.textContent = 'сейчас';
  } else if (!s.enabled || !s.next_pulse_time) {
    manualPulseEl.hidden = true;
    nextPulseEl.textContent = '—';
  } else {
    manualPulseEl.hidden = true;
    const when = (s.next_pulse_today ? 'сегодня' : 'завтра') + ' в ' + s.next_pulse_time;
    nextPulseEl.textContent = when;
  }
  renderPulseSchedule(s.pulse_times);
}

async function load() {
  try {
    const [info, s] = await Promise.all([
      fetch('/api/info').then(r => r.json()),
      fetch('/api/settings').then(r => r.json()),
    ]);
    document.getElementById('meta').textContent =
      info.name + ' · v' + info.version + ' · ' + info.chip;
    document.getElementById('update-meta').textContent =
      'Текущая версия: ' + info.version;
    document.getElementById('name').value = s.name || info.name;
    modeEl.value = s.mode;
    document.getElementById('on').value = s.on;
    document.getElementById('off').value = s.off;
    document.getElementById('pulse_interval_min').value = s.pulse_interval_min;
    document.getElementById('pulse_duration_sec').value = s.pulse_duration_sec;
    document.getElementById('gpio').value = s.gpio;
    document.getElementById('enabled').checked = s.enabled;
    applyModeVisibility();
  } catch (e) {
    setStatus('не удалось загрузить настройки', 'err');
  }
}

async function renderPeers() {
  const listEl = document.getElementById('peers-list');
  const statusEl = document.getElementById('peers-status');
  statusEl.textContent = 'поиск…';
  listEl.innerHTML = '';
  try {
    const peers = await fetch('/api/peers').then(r => r.json());
    if (peers.length === 0) {
      statusEl.textContent = 'никого не найдено';
      return;
    }
    statusEl.textContent = '';
    for (const p of peers) {
      const li = document.createElement('li');
      const url = p.host ? ('http://' + p.host + '/') : ('http://' + p.ip + ':' + p.port + '/');
      li.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${p.name}</a>` +
        ` · v${p.version} · ${p.chip} · ${p.mode}`;
      listEl.appendChild(li);
    }
  } catch (e) {
    statusEl.textContent = 'ошибка поиска';
  }
}

async function updateStatus() {
  try {
    const s = await fetch('/api/status').then(r => r.json());
    renderStatus(s);
  } catch (e) {
    // молча игнорируем — ошибки будут видны при следующем load
  }
}

document.getElementById('water-now').addEventListener('click', async () => {
  setStatus('запускаю полив…');
  try {
    const r = await fetch('/api/water-now', { method: 'POST' });
    if (r.ok) {
      const s = await r.json();
      renderStatus(s);
      setStatus('полив запущен', 'ok');
    } else {
      setStatus('ошибка: ' + await r.text(), 'err');
    }
  } catch (e) {
    setStatus('нет связи с устройством', 'err');
  }
});

document.getElementById('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const body = {
    name: document.getElementById('name').value,
    mode: modeEl.value,
    on: document.getElementById('on').value,
    off: document.getElementById('off').value,
    pulse_interval_min: Number(document.getElementById('pulse_interval_min').value),
    pulse_duration_sec: Number(document.getElementById('pulse_duration_sec').value),
    gpio: Number(document.getElementById('gpio').value),
    enabled: document.getElementById('enabled').checked,
  };
  setStatus('сохраняю…');
  try {
    const r = await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    if (r.ok) {
      const s = await r.json();
      setStatus('сохранено', 'ok');
      // перечитаем, чтобы статус полива соответствовал новым настройкам
      await load();
      await updateStatus();
    } else {
      setStatus('ошибка: ' + await r.text(), 'err');
    }
  } catch (e) {
    setStatus('нет связи с устройством', 'err');
  }
});

load();
renderPeers();
setInterval(updateStatus, 5000);
setInterval(fetchUpdateStatus, 5000);
setInterval(renderPeers, 30000);
fetchUpdateStatus();
</script>
</body>
</html>
